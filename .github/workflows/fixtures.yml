name: fixtures

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - fix-reverse-strand-output-reconstruction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Fixtures (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake opencl-headers ocl-icd-opencl-dev pocl-opencl-icd clinfo

      - name: Show OpenCL devices
        run: clinfo

      - name: Restore build cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-cpu-build-${{ hashFiles('CMakeLists.txt', 'config.h.in', '*.cpp', '*.h', 'cas-offinder.cl', 'fixtures/**', '.github/workflows/fixtures.yml') }}
          restore-keys: |
            ${{ runner.os }}-cpu-build-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run fixture suite
        run: ./fixtures/check-fixtures.sh ./build/cas-offinder C

  gpu:
    name: Fixtures (gpu)
    if: ${{ vars.GH_GPU_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.GH_GPU_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-gpu-build-${{ hashFiles('CMakeLists.txt', 'config.h.in', '*.cpp', '*.h', 'cas-offinder.cl', 'fixtures/**', '.github/workflows/fixtures.yml') }}
          restore-keys: |
            ${{ runner.os }}-gpu-build-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run fixture suite
        run: ./fixtures/check-fixtures.sh ./build/cas-offinder G
